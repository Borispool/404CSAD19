name: CMake CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@v3.29.3

      - name: Build and test on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ci.sh
          ./ci.sh

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat
